name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build-test:
    name: Build and test on Windows
    runs-on: windows-latest
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: 1
      DOTNET_NOLOGO: 1
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore
        run: dotnet restore AgentOrb.sln

      - name: Build (Release)
        run: dotnet build AgentOrb.sln -c Release --no-restore

      - name: Run tests
        run: dotnet run --project tests/AgentOrb.Tests/AgentOrb.Tests.csproj -c Release --no-build

      - name: Upload build logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ci-logs-${{ github.run_id }}
          path: |
            **/*.binlog
          if-no-files-found: ignore
